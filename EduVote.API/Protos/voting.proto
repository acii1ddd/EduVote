syntax = "proto3";

option csharp_namespace = "EduVote.API";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

package edu_vote.v1.voting;

service Votings {
  rpc CreateVoting (CreateVotingRequest) returns (VotingResponse) {
    option (google.api.http) = {
      post: "/api/votings"
      body: "*"
    };
  }

  rpc UpdateVoting (UpdateVotingRequest) returns (VotingResponse) {
    option (google.api.http) = {
      put: "/api/votings/{id}"
      body: "*"
    };
  }

  rpc DeleteVoting (DeleteVotingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/votings/{id}"
    };
  }

  rpc StartVoting (VotingActionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/votings/{id}/start"
    };
  }

  rpc PauseVoting (VotingActionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/votings/{id}/pause"
    };
  }

  rpc FinishVoting (VotingActionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/votings/{id}/finish"
    };
  }

  rpc GetVoting (GetVotingRequest) returns (VotingResponse) {
    option (google.api.http) = {
      get: "/api/votings/{id}"
    };
  }

  rpc GetVotings (google.protobuf.Empty) returns (GetVotingsResponse) {
    option (google.api.http) = {
      get: "/api/votings"
    };
  }

  rpc CastVote (CastVoteRequest) returns (CastVoteResponse) {
    option (google.api.http) = {
      post: "/api/votings/{voting_id}/vote"
      body: "*"
    };
  }

  rpc GetResults (GetVotingRequest) returns (VotingResultsResponse) {
    option (google.api.http) = {
      get: "/api/votings/{id}/results"
    };
  }

  rpc GetVotingsForUser (GetVotingsForUserRequest) returns (GetVotingsResponse) {
    option (google.api.http) = {
      get: "/api/users/{user_id}/votings"
    };
  }

//  rpc GetStats (GetVotingRequest) returns (VotingStatsResponse) {
//    option (google.api.http) = {
//      get: "/api/votings/{id}/stats"
//    };
//  }
//
//  rpc GetVerification (GetVotingRequest) returns (VotingVerificationResponse) {
//    option (google.api.http) = {
//      get: "/api/votings/{id}/verification"
//    };
//  }
}

enum VotingType {
  VotingTypeUnspecified = 0;
  SingleChoice = 1;
  MultipleChoice = 2;
  Rating = 3;
  OpenAnswer = 4;
}

enum VotingStatus {
  VotingStatusUnspecified = 0;
  Draft = 1;
  Active = 2;
  Paused = 3;
  Finished = 4;
}

message Voting {
  string id = 1;
  string title = 2;
  string description = 3;
  VotingType type = 4;
  bool is_anonymous = 5;
  bool allow_vote_change = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  VotingStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateVotingRequest {
  string title = 1;
  string description = 2;
  VotingType type = 3;
  bool is_anonymous = 4;
  bool allow_vote_change = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
}

message UpdateVotingRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  VotingType type = 4;
  bool is_anonymous = 5;
  bool allow_vote_change = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
}

message DeleteVotingRequest {
  string id = 1;
}

message VotingActionRequest {
  string id = 1;
}

message GetVotingRequest {
  string id = 1;
}

message VotingResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  VotingType type = 4;
  bool is_anonymous = 5;
  bool allow_vote_change = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  VotingStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetVotingsResponse {
  repeated VotingResponse votings = 1;
}

message GetVotingsForUserRequest {
  string user_id = 1;
}

message CastVoteRequest {
  string voting_id = 1;
  string user_id = 2;
  // Single Choice - selected candidate ID
  string selected_candidate_id = 3;
  // Multiple Choice - selected candidate IDs
  repeated string selected_candidate_ids = 4;
  // Rating - map of candidate ID to rating value (1-5)
  map<string, int32> rating_answers = 5;
  // Open Answer - text response
  string text_answer = 6;
}

message CastVoteResponse {
  string vote_id = 1;
  string vote_hash = 2;
  google.protobuf.Timestamp created_at = 3;
}

message VotingResultsResponse {
  string voting_id = 1;
  map<string, google.protobuf.Struct> results = 2;  // Candidate ID -> result object
  string result_hash = 3;
  google.protobuf.Timestamp calculated_at = 4;
  int32 total_votes = 5;
}

