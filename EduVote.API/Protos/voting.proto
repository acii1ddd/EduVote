syntax = "proto3";

option csharp_namespace = "EduVote.API";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package voting;

service Votings {
  rpc CreateVoting (CreateVotingRequest) returns (VotingResponse) {
    option (google.api.http) = {
      post: "/api/votings"
      body: "*"
    };
  }

  rpc UpdateVoting (UpdateVotingRequest) returns (VotingResponse) {
    option (google.api.http) = {
      put: "/api/votings/{id}"
      body: "*"
    };
  }

  rpc DeleteVoting (DeleteVotingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/votings/{id}"
    };
  }

  rpc StartVoting (VotingActionRequest) returns (VotingResponse) {
    option (google.api.http) = {
      post: "/api/votings/{id}/start"
    };
  }

  rpc PauseVoting (VotingActionRequest) returns (VotingResponse) {
    option (google.api.http) = {
      post: "/api/votings/{id}/pause"
    };
  }

  rpc FinishVoting (VotingActionRequest) returns (VotingResponse) {
    option (google.api.http) = {
      post: "/api/votings/{id}/finish"
    };
  }

  rpc GetVoting (GetVotingRequest) returns (VotingResponse) {
    option (google.api.http) = {
      get: "/api/votings/{id}"
    };
  }

  rpc GetVotings (google.protobuf.Empty) returns (GetVotingsResponse) {
    option (google.api.http) = {
      get: "/api/votings"
    };
  }
}

enum VotingType {
  VotingTypeUnspecified = 0;
  SingleChoice = 1;
  MultipleChoice = 2;
  Rating = 3;
  OpenAnswer = 4;
}

enum VotingStatus {
  VotingStatusUnspecified = 0;
  Draft = 1;
  Active = 2;
  Paused = 3;
  Finished = 4;
}

message Voting {
  string id = 1;
  string title = 2;
  string description = 3;
  VotingType type = 4;
  bool is_anonymous = 5;
  bool allow_vote_change = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  VotingStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateVotingRequest {
  string title = 1;
  string description = 2;
  VotingType type = 3;
  bool is_anonymous = 4;
  bool allow_vote_change = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
}

message UpdateVotingRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  VotingType type = 4;
  bool is_anonymous = 5;
  bool allow_vote_change = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
}

message DeleteVotingRequest {
  string id = 1;
}

message VotingActionRequest {
  string id = 1;
}

message GetVotingRequest {
  string id = 1;
}

message VotingResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  VotingType type = 4;
  bool is_anonymous = 5;
  bool allow_vote_change = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  VotingStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetVotingsResponse {
  repeated VotingResponse votings = 1; // массив/список
}